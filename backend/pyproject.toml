[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-copilot-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9",
  "pydantic-settings>=2.4,<3", "pydantic>=2.8,<3", "httpx>=0.27,<1",
  "langgraph>=0.2,<2", "google-genai>=1.0,<2", "pypdf>=5,<7",
  "qdrant-client>=1.11,<2", "rank-bm25>=0.2.2,<1", "voyageai>=0.3,<1",
  "cohere>=5,<6", "certifi>=2024.2.2", "Pillow>=10,<13", "python-docx>=1.1,<2", "PyMuPDF>=1.24,<2",
  "pytesseract>=0.3.13,<1", "reportlab>=4,<6"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
